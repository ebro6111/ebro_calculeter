
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="bootstrap-5.3.8-dist/bootstrap-5.3.8-dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
    <title>Calculator</title>
</head>
<body class="bg-info">
    <section class="container d-flex justify-content-center align-items-center min-vh-100">
        <div class="calculator  p-4 rounded-4 shadow-lg">
            <input id="display" class="form-control display mb-3 text-end" placeholder="0" >
            <div class="row g-2 mb-2">
                <div class="col-3"> <button class="btn btn-danger w-100" onclick="clearDisplay()">AC</button></div>
                <div class="col-3"> <button class="btn btn-secondary w-100" onclick="backspace()">⌫</button></div>
                <div class="col-3"><button class="btn btn-secondary w-100" onclick="appendToDisplay('%')">%</button></div>
                <div class="col-3"><button class="btn btn-warning w-100" onclick="appendToDisplay('/')">/</button> </div>
            </div>

            <div class="row g-2 mb-2">
                <div class="col-3"><button class="btn btn-light w-100 fw-bold" onclick="appendToDisplay('7')">7</button></div>
                <div class="col-3"><button class="btn btn-light w-100 fw-bold" onclick="appendToDisplay('8')">8</button></div>
                <div class="col-3"><button class="btn btn-light w-100 fw-bold " onclick="appendToDisplay('9')">9</button></div>
                <div class="col-3"><button class="btn btn-warning w-100" onclick="appendToDisplay('*')">*</button></div>
            </div>

            <div class="row g-2 mb-2">
                <div class="col-3"><button class="btn btn-light w-100 fw-bold" onclick="appendToDisplay('4')">4</button></div>
                <div class="col-3"><button class="btn btn-light w-100 fw-bold" onclick="appendToDisplay('5')">5</button></div>
                <div class="col-3"><button class="btn btn-light w-100 fw-bold" onclick="appendToDisplay('6')">6</button></div>
                <div class="col-3"><button class="btn btn-warning w-100 fw-bold" onclick="appendToDisplay('-')">-</button></div>
            </div>

            <div class="row g-2 mb-2">
                <div class="col-3"><button class="btn btn-light w-100 fw-bold" onclick="appendToDisplay('1')">1</button></div>
                <div class="col-3"><button class="btn btn-light w-100 fw-bold" onclick="appendToDisplay('2')">2</button></div>
                <div class="col-3"><button class="btn btn-light w-100 fw-bold" onclick="appendToDisplay('3')">3</button></div>
                <div class="col-3"><button class="btn btn-warning w-100" onclick="appendToDisplay('+')">+</button></div>
            </div>

            <div class="row g-2">
                <div class="col-3"><button class="btn btn-secondary w-100"  onclick="appendBrackets()">()</button></div>
                <div class="col-3"><button class="btn btn-light w-100 fw-bold" onclick="appendToDisplay('0')">0</button></div>
                <div class="col-3"><button class="btn btn-light w-100 fw-bolder " onclick="appendToDisplay('.')">.</button></div>
                <div class="col-3"><button class="btn btn-success w-100" onclick="calculate()">=</button></div>
            </div>
        </div>
    </section>

    <script src="script.js"></script>

</body>
</html>
